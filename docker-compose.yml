services:
  assistant:
    build: .
    image: offline-humanized-assistant:latest
    container_name: offline-humanized-assistant
    env_file:
      - .env
    ports:
      - "8092:8092"
    volumes:
      - ./documents:/app/documents
      - ./data:/app/data
      - ./models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASSISTANT_DASHBOARD_HOST: 0.0.0.0
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
    restart: unless-stopped

  ingest:
    build: .
    image: offline-humanized-assistant:latest
    env_file:
      - .env
    volumes:
      - ./documents:/app/documents
      - ./data:/app/data
      - ./models:/app/models
    command: ["assistant-ingest", "/app/documents"]
    profiles:
      - tools
